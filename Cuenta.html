<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Cuenta – Zona iPhone</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-dark:#9A7A2E;--black:#0A0A0A;--white:#FFFFFF;--gray:#F5F5F5;--gray-dark:#888;--font-display:'Bebas Neue',sans-serif;--font-body:'Montserrat',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--black);color:var(--white);min-height:100vh;}

/* ── LOGIN ── */
#login-view{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px;
  background:radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.12) 0%, transparent 60%), var(--black);
}
.login-card{
  width:100%; max-width:380px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(201,168,76,0.2);
  border-radius:24px; padding:40px 32px;
  text-align:center;
  box-shadow:0 32px 80px rgba(0,0,0,0.6);
}
.login-logo{width:72px;height:72px;object-fit:contain;margin:0 auto 16px;display:block;filter:drop-shadow(0 0 16px rgba(201,168,76,0.4));}
.login-brand{font-family:var(--font-display);font-size:22px;letter-spacing:4px;color:var(--white);margin-bottom:4px;}
.login-brand span{color:var(--gold);}
.login-sub{font-size:11px;color:var(--gray-dark);letter-spacing:2px;text-transform:uppercase;margin-bottom:32px;}
.field-label{display:block;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray-dark);margin-bottom:6px;text-align:left;}
.field-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--white);padding:14px 16px;border-radius:10px;font-size:16px;font-family:var(--font-body);outline:none;transition:border-color 0.2s;margin-bottom:16px;}
.field-input:focus{border-color:var(--gold);}
.field-input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;}
.btn-login{width:100%;background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));color:var(--black);padding:16px;border:none;border-radius:10px;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;margin-top:4px;}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(201,168,76,0.4);}
.login-error{color:#FF5555;font-size:12px;margin-top:12px;display:none;}
.login-help{margin-top:20px;font-size:11px;color:rgba(255,255,255,0.3);line-height:1.6;}
.login-help a{color:var(--gold);text-decoration:none;}

/* ── DASHBOARD ── */
#dash-view{display:none;min-height:100vh;}
.dash-nav{
  background:rgba(255,255,255,0.03);
  border-bottom:1px solid rgba(201,168,76,0.15);
  padding:0 20px; height:60px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
  backdrop-filter:blur(10px);
}
.dash-nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.dash-nav-logo img{width:32px;height:32px;object-fit:contain;}
.dash-nav-brand{font-family:var(--font-display);font-size:18px;letter-spacing:3px;color:var(--white);}
.dash-nav-brand span{color:var(--gold);}
.btn-logout-client{background:none;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.4);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:11px;font-family:var(--font-body);transition:all 0.2s;}
.btn-logout-client:hover{border-color:rgba(255,80,80,0.4);color:#FF5555;}

.dash-body{padding:24px 20px;max-width:700px;margin:0 auto;}

/* greeting */
.dash-greeting{margin-bottom:28px;}
.dash-greeting-name{font-family:var(--font-display);font-size:clamp(28px,7vw,44px);letter-spacing:3px;color:var(--white);line-height:1;margin-bottom:4px;}
.dash-greeting-sub{font-size:12px;color:var(--gray-dark);letter-spacing:1px;}

/* summary cards */
.dash-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px;}
.dash-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:20px;}
.dash-card-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray-dark);margin-bottom:8px;}
.dash-card-value{font-family:var(--font-display);font-size:26px;color:var(--white);letter-spacing:1px;}
.dash-card-value.gold{color:var(--gold);}
.dash-card-value.red{color:#FF5555;}
.dash-card-value.green{color:#25D366;}

/* product info */
.dash-product{background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);border-radius:16px;padding:20px;margin-bottom:24px;}
.dash-product-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.dash-product-name{font-size:16px;font-weight:800;color:var(--white);margin-bottom:8px;}
.dash-product-meta{display:flex;flex-wrap:wrap;gap:16px;}
.dash-product-meta span{font-size:12px;color:rgba(255,255,255,0.5);}
.dash-product-meta strong{color:var(--white);}

/* cuotas */
.dash-section-title{font-family:var(--font-display);font-size:22px;letter-spacing:2px;color:var(--white);margin-bottom:14px;}
.cuota-item{
  display:flex; align-items:center; gap:12px;
  padding:14px 16px; border-radius:12px; margin-bottom:8px;
  background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);
  transition:border-color 0.2s;
}
.cuota-item.pagada{background:rgba(37,211,102,0.06);border-color:rgba(37,211,102,0.15);}
.cuota-item.mora{background:rgba(255,50,50,0.06);border-color:rgba(255,50,50,0.15);}
.cuota-item.proxima{border-color:rgba(201,168,76,0.3);background:rgba(201,168,76,0.05);}
.cuota-num{font-family:var(--font-display);font-size:22px;min-width:32px;color:var(--gray-dark);}
.cuota-info{flex:1;}
.cuota-monto{font-size:15px;font-weight:700;color:var(--white);}
.cuota-fecha{font-size:11px;color:var(--gray-dark);margin-top:2px;}
.cuota-badge{font-size:10px;font-weight:700;padding:4px 10px;border-radius:10px;letter-spacing:1px;white-space:nowrap;}
.cuota-badge.pagada{background:rgba(37,211,102,0.15);color:#25D366;}
.cuota-badge.mora{background:rgba(255,50,50,0.15);color:#FF5555;}
.cuota-badge.pendiente{background:rgba(201,168,76,0.15);color:var(--gold);}

/* whatsapp help */
.dash-help{
  margin-top:28px; background:rgba(37,211,102,0.06);
  border:1px solid rgba(37,211,102,0.15); border-radius:16px; padding:20px;
  display:flex; align-items:center; gap:16px;
}
.dash-help-text{flex:1;}
.dash-help-text p{font-size:13px;color:rgba(255,255,255,0.6);margin-top:4px;}
.dash-help-title{font-size:13px;font-weight:700;color:var(--white);}
.btn-wa{display:inline-flex;align-items:center;gap:6px;background:#25D366;color:white;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:800;text-decoration:none;transition:transform 0.2s;white-space:nowrap;}
.btn-wa:hover{transform:translateY(-1px);}

/* no credit state */
.dash-nocredito{text-align:center;padding:40px 20px;}
.dash-nocredito p{font-size:14px;color:var(--gray-dark);margin-bottom:20px;line-height:1.6;}

/* responsive */
@media(max-width:400px){.login-card{padding:32px 20px;}}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:#111;}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.3);border-radius:3px;}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyBokhn1xCmmpQe9m5dgf9KCKutyHyVvFkc",
  authDomain:"zona-iphone.firebaseapp.com",
  projectId:"zona-iphone",
  storageBucket:"zona-iphone.firebasestorage.app",
  messagingSenderId:"382361893657",
  appId:"1:382361893657:web:50ecd0fa4cea9d3022a388"
});
const db = getFirestore(app);
const storeRef = doc(db,'tienda','config');

function formatPrice(n){ return '$'+Number(n).toLocaleString('es-CO'); }

window.doLogin = async function(){
  const cedula = document.getElementById('inp-cedula').value.trim();
  const pin = document.getElementById('inp-pin').value.trim();
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  if(!cedula||!pin){ errEl.textContent='Ingresa tu cédula y PIN.'; errEl.style.display='block'; return; }

  try{
    const snap = await getDoc(storeRef);
    if(!snap.exists()){ errEl.textContent='Error de conexión. Intenta de nuevo.'; errEl.style.display='block'; return; }
    const data = snap.data();
    const clientes = data.clientesCRM||[];
    const cliente = clientes.find(c=>String(c.cedula)===String(cedula)&&String(c.pin)===String(pin));

    if(!cliente){ errEl.textContent='Cédula o PIN incorrecto. Contacta a Zona iPhone.'; errEl.style.display='block'; return; }

    renderDash(cliente);
    document.getElementById('login-view').style.display='none';
    document.getElementById('dash-view').style.display='block';
  } catch(e){
    errEl.textContent='Error de conexión. Intenta más tarde.';
    errEl.style.display='block';
  }
};

window.doLogout = function(){
  document.getElementById('login-view').style.display='flex';
  document.getElementById('dash-view').style.display='none';
  document.getElementById('inp-cedula').value='';
  document.getElementById('inp-pin').value='';
};

function renderDash(c){
  const cuotas = c.cuotas||[];
  const pagadas = cuotas.filter(q=>q.pagada).length;
  const hoy = new Date();
  const mora = cuotas.filter(q=>!q.pagada && new Date(q.fecha)<hoy);
  const proxima = cuotas.find(q=>!q.pagada);
  const deuda = Math.max(0,(c.total||0)-(c.abono||0)-cuotas.filter(q=>q.pagada).reduce((s,q)=>s+(q.monto||0),0));
  const estadoColor = mora.length>0?'red':deuda===0?'green':'gold';
  const estadoText = mora.length>0?`⚠️ ${mora.length} en mora`:deuda===0?'✅ Al día':'💳 En crédito';

  const cuotasHtml = cuotas.map((q,i)=>{
    const vencida = !q.pagada && new Date(q.fecha)<hoy;
    const esProxima = !q.pagada && !vencida && proxima===q;
    const cls = q.pagada?'pagada':vencida?'mora':esProxima?'proxima':'';
    const badge = q.pagada?'pagada':vencida?'mora':'pendiente';
    const badgeText = q.pagada?'✓ Pagada':vencida?'Vencida':esProxima?'Próxima':'Pendiente';
    return `<div class="cuota-item ${cls}">
      <div class="cuota-num">${i+1}</div>
      <div class="cuota-info">
        <div class="cuota-monto">${formatPrice(q.monto||0)}</div>
        <div class="cuota-fecha">Vence: ${q.fecha||'—'}${q.pagada&&q.fechaPago?' · Pagada: '+q.fechaPago:''}</div>
      </div>
      <span class="cuota-badge ${badge}">${badgeText}</span>
    </div>`;
  }).join('');

  document.getElementById('dash-body').innerHTML = `
    <div class="dash-greeting">
      <div class="dash-greeting-name">Hola, ${(c.name||'').split(' ')[0]}</div>
      <div class="dash-greeting-sub">Bienvenido a tu portal de pagos</div>
    </div>

    <div class="dash-cards">
      <div class="dash-card"><div class="dash-card-label">Estado</div><div class="dash-card-value ${estadoColor}" style="font-size:13px;padding-top:4px;">${estadoText}</div></div>
      <div class="dash-card"><div class="dash-card-label">Deuda restante</div><div class="dash-card-value ${deuda>0?(mora.length?'red':'gold'):'green'}" style="font-size:${deuda>99999?'16px':'22px'};">${deuda>0?formatPrice(deuda):'$0'}</div></div>
      <div class="dash-card"><div class="dash-card-label">Cuotas pagadas</div><div class="dash-card-value gold">${pagadas}/${cuotas.length}</div></div>
      ${proxima?`<div class="dash-card"><div class="dash-card-label">Próximo pago</div><div class="dash-card-value" style="font-size:13px;padding-top:4px;">${proxima.fecha||'—'}</div></div>`:''}
    </div>

    ${c.product?`<div class="dash-product">
      <div class="dash-product-label">Tu compra</div>
      <div class="dash-product-name">${c.product}</div>
      <div class="dash-product-meta">
