<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Cuenta – Zona iPhone</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-dark:#9A7A2E;--black:#0A0A0A;--white:#FFFFFF;--gray:#F5F5F5;--gray-dark:#888;--font-display:'Bebas Neue',sans-serif;--font-body:'Montserrat',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--black);color:var(--white);min-height:100vh;}

/* LOADING */
#loading-view{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black);}
.spin{width:36px;height:36px;border:3px solid rgba(201,168,76,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* NOT LOGGED */
#nologin-view{min-height:100vh;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,0.1) 0%,transparent 60%),var(--black);}
.nologin-card{max-width:340px;text-align:center;}
.nologin-icon{font-size:48px;margin-bottom:16px;}
.nologin-title{font-family:var(--font-display);font-size:28px;letter-spacing:3px;margin-bottom:8px;}
.nologin-sub{font-size:13px;color:var(--gray-dark);line-height:1.6;margin-bottom:24px;}
.btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));color:var(--black);padding:14px 28px;border:none;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:var(--font-body);text-decoration:none;display:inline-block;transition:transform 0.2s,box-shadow 0.2s;}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(201,168,76,0.4);}

/* DASHBOARD */
#dash-view{display:none;min-height:100vh;}
.dash-nav{background:rgba(10,10,10,0.95);border-bottom:1px solid rgba(201,168,76,0.15);padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);}
.dash-nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.dash-nav-brand{font-family:var(--font-display);font-size:18px;letter-spacing:3px;color:var(--white);}
.dash-nav-brand span{color:var(--gold);}
.btn-logout{background:none;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.45);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:11px;font-family:var(--font-body);transition:all 0.2s;}
.btn-logout:hover{border-color:rgba(255,80,80,0.5);color:#FF5555;}
.dash-body{padding:24px 20px;max-width:700px;margin:0 auto;}

/* Greeting */
.dash-greeting-name{font-family:var(--font-display);font-size:clamp(28px,7vw,44px);letter-spacing:3px;color:var(--white);line-height:1;margin-bottom:4px;}
.dash-greeting-sub{font-size:12px;color:var(--gray-dark);letter-spacing:1px;margin-bottom:24px;}

/* Info card */
.info-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:18px;margin-bottom:20px;}
.info-card-title{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray-dark);margin-bottom:12px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.info-item-label{font-size:9px;color:var(--gray-dark);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
.info-item-value{font-size:14px;font-weight:700;color:var(--white);}

/* Summary cards */
.dash-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px;}
.dash-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:18px;}
.dash-card-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray-dark);margin-bottom:8px;}
.dash-card-value{font-family:var(--font-display);font-size:22px;color:var(--white);letter-spacing:1px;}
.dash-card-value.gold{color:var(--gold);}
.dash-card-value.red{color:#FF5555;}
.dash-card-value.green{color:#25D366;}

/* Product */
.dash-product{background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);border-radius:14px;padding:18px;margin-bottom:20px;}
.dash-product-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.dash-product-name{font-size:16px;font-weight:800;color:var(--white);margin-bottom:10px;}
.dash-product-meta{display:flex;flex-wrap:wrap;gap:14px;}
.dash-product-meta span{font-size:12px;color:rgba(255,255,255,0.5);}
.dash-product-meta strong{color:var(--white);}

/* Cuotas */
.dash-section-title{font-family:var(--font-display);font-size:22px;letter-spacing:2px;color:var(--white);margin-bottom:12px;margin-top:4px;}
.cuota-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);transition:border-color 0.2s;}
.cuota-item.pagada{background:rgba(37,211,102,0.05);border-color:rgba(37,211,102,0.15);}
.cuota-item.mora{background:rgba(255,50,50,0.05);border-color:rgba(255,50,50,0.15);}
.cuota-item.proxima{border-color:rgba(201,168,76,0.3);background:rgba(201,168,76,0.04);}
.cuota-num{font-family:var(--font-display);font-size:22px;min-width:32px;color:var(--gray-dark);}
.cuota-info{flex:1;}
.cuota-monto{font-size:15px;font-weight:700;color:var(--white);}
.cuota-fecha{font-size:11px;color:var(--gray-dark);margin-top:2px;}
.cuota-badge{font-size:10px;font-weight:700;padding:4px 10px;border-radius:10px;letter-spacing:1px;white-space:nowrap;}
.cuota-badge.pagada{background:rgba(37,211,102,0.15);color:#25D366;}
.cuota-badge.mora{background:rgba(255,50,50,0.15);color:#FF5555;}
.cuota-badge.pendiente{background:rgba(201,168,76,0.15);color:var(--gold);}

/* Historial */
.historial-card{background:rgba(37,211,102,0.05);border:1px solid rgba(37,211,102,0.15);border-radius:14px;padding:18px;margin-bottom:16px;}
.historial-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(37,211,102,0.15);color:#25D366;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:10px;}

/* WA help */
.dash-help{margin-top:24px;background:rgba(37,211,102,0.05);border:1px solid rgba(37,211,102,0.12);border-radius:14px;padding:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.dash-help-text{flex:1;min-width:140px;}
.dash-help-title{font-size:13px;font-weight:700;color:var(--white);margin-bottom:3px;}
.dash-help-sub{font-size:12px;color:rgba(255,255,255,0.5);}
.btn-wa{display:inline-flex;align-items:center;gap:6px;background:#25D366;color:white;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:800;text-decoration:none;white-space:nowrap;transition:transform 0.2s;}
.btn-wa:hover{transform:translateY(-1px);}

/* Pending */
.pending-card{background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);border-radius:14px;padding:24px;text-align:center;margin-bottom:20px;}

@media(max-width:400px){.info-grid{grid-template-columns:1fr;}.dash-help{flex-direction:column;}}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:#111;}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.3);border-radius:3px;}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-view"><div class="spin"></div></div>

<!-- Not logged in -->
<div id="nologin-view">
  <div class="nologin-card">
    <div class="nologin-icon">📱</div>
    <div class="nologin-title">ZONA iPHONE</div>
    <p class="nologin-sub">Inicia sesión para ver el estado de tu producto, tus cuotas y tu historial de compras.</p>
    <a href="index.html#auth" class="btn-gold" onclick="sessionStorage.setItem('openAuth','login')">Iniciar sesión</a>
    <div style="margin-top:12px;">
      <a href="index.html" style="color:var(--gray-dark);font-size:12px;text-decoration:none;">← Volver a la tienda</a>
    </div>
  </div>
</div>

<!-- Dashboard -->
<div id="dash-view">
  <nav class="dash-nav">
    <a href="index.html" class="dash-nav-logo">
      <div class="dash-nav-brand">Z<span>O</span>NA <span>iPHONE</span></div>
    </a>
    <button class="btn-logout" onclick="doLogout()">Salir ↩</button>
  </nav>
  <div class="dash-body" id="dash-body">
    <div style="display:flex;align-items:center;justify-content:center;padding:60px 0;"><div class="spin"></div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const app = initializeApp({
  apiKey:"AIzaSyBokhn1xCmmpQe9m5dgf9KCKutyHyVvFkc",
  authDomain:"zona-iphone.firebaseapp.com",
  projectId:"zona-iphone",
  storageBucket:"zona-iphone.firebasestorage.app",
  messagingSenderId:"382361893657",
  appId:"1:382361893657:web:50ecd0fa4cea9d3022a388"
});
const db = getFirestore(app);
const auth = getAuth(app);
const storeRef = doc(db,'tienda','config');

function formatPrice(n){ return '$'+Number(n).toLocaleString('es-CO'); }

window.doLogout = async function() {
  await signOut(auth);
  window.location.href='index.html';
};

onAuthStateChanged(auth, async user => {
  document.getElementById('loading-view').style.display='none';
  if (!user) {
    document.getElementById('nologin-view').style.display='flex';
    return;
  }
  document.getElementById('dash-view').style.display='block';
  // Load client data
  try {
    const snap = await getDoc(storeRef);
    const crm = snap.exists() ? (snap.data().clientesCRM||[]) : [];
    const c = crm.find(x=>x.uid===user.uid || x.email===user.email);
    renderDash(user, c);
  } catch(e) {
    renderDash(user, null);
  }
});

function renderDash(user, c) {
  const nombre = user.displayName || user.email.split('@')[0];
  const hoy = new Date();
  const cuotas = c?.cuotas || [];
  const pagadas = cuotas.filter(q=>q.pagada).length;
  const mora = cuotas.filter(q=>!q.pagada && new Date(q.fecha)<hoy);
  const proxima = cuotas.find(q=>!q.pagada);
  const deuda = c ? Math.max(0,(c.total||0)-(c.abono||0)-cuotas.filter(q=>q.pagada).reduce((s,q)=>s+(q.monto||0),0)) : 0;
  const estadoColor = mora.length>0?'red':deuda===0&&cuotas.length>0?'green':'gold';
  const estadoText = mora.length>0?`⚠️ ${mora.length} en mora`:deuda===0&&cuotas.length>0?'✅ Al día':cuotas.length>0?'💳 Activo':'—';

  const cuotasHtml = cuotas.length ? cuotas.map((q,i)=>{
    const vencida = !q.pagada && new Date(q.fecha)<hoy;
    const esProxima = !q.pagada && !vencida && proxima===q;
    const cls = q.pagada?'pagada':vencida?'mora':esProxima?'proxima':'';
    const badge = q.pagada?'pagada':vencida?'mora':'pendiente';
    const badgeText = q.pagada?'✓ Pagada':vencida?'Vencida':esProxima?'Próxima':'Pendiente';
    return `<div class="cuota-item ${cls}">
      <div class="cuota-num">${i+1}</div>
      <div class="cuota-info">
        <div class="cuota-monto">${formatPrice(q.monto||0)}</div>
        <div class="cuota-fecha">Vence: ${q.fecha||'—'}${q.pagada&&q.fechaPago?' · Pagada: '+q.fechaPago:''}</div>
      </div>
      <span class="cuota-badge ${badge}">${badgeText}</span>
    </div>`;
  }).join('') : '';

  // Check if fully paid (historial)
  const totalPagado = cuotas.filter(q=>q.pagada).reduce((s,q)=>s+(q.monto||0),0) + (c?.abono||0);
  const pagadoTotal = c && c.total>0 && totalPagado >= c.total;

  document.getElementById('dash-body').innerHTML = `
    <div style="margin-bottom:24px;">
      <div class="dash-greeting-name">Hola, ${nombre.split(' ')[0]}</div>
      <div class="dash-greeting-sub">Bienvenido a tu cuenta</div>
    </div>

    ${!c || c.estado==='solicitud' ? `
    <div class="pending-card">
      <div style="font-size:32px;margin-bottom:12px;">⏳</div>
      <div style="font-family:var(--font-display);font-size:20px;letter-spacing:2px;margin-bottom:8px;">SOLICITUD EN PROCESO</div>
      <p style="font-size:13px;color:rgba(255,255,255,0.55);line-height:1.6;">Tu registro fue recibido. Pronto te contactaremos por WhatsApp para continuar con tu compra.</p>
      ${c?.product?`<div style="margin-top:14px;background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.2);border-radius:10px;padding:12px;font-size:13px;">📦 Producto de interés: <strong style="color:var(--gold);">${c.product}</strong></div>`:''}
    </div>` : ''}

    ${c && c.estado!=='solicitud' ? `
    <div class="info-card">
      <div class="info-card-title">👤 Tu información</div>
      <div class="info-grid">
        <div><div class="info-item-label">Cédula</div><div class="info-item-value">${c.cedula||'—'}</div></div>
        <div><div class="info-item-label">Teléfono</div><div class="info-item-value">${c.phone||'—'}</div></div>
        <div><div class="info-item-label">Forma de pago</div><div class="info-item-value">${c.formaPago==='contado'?'💵 Contado':c.formaPago==='credito'?'💳 Crédito':c.formaPago==='transferencia'?'🏦 Transferencia':c.formaPago||'—'}</div></div>
        <div><div class="info-item-label">Estado</div><div class="info-item-value dash-card-value ${estadoColor}" style="font-size:12px;padding-top:0;">${estadoText}</div></div>
      </div>
    </div>

    <div class="dash-cards">
      <div class="dash-card"><div class="dash-card-label">Deuda</div><div class="dash-card-value ${deuda>0?(mora.length?'red':'gold'):'green'}" style="font-size:${deuda>999999?'14px':'20px'};">${deuda>0?formatPrice(deuda):'$0'}</div></div>
      ${cuotas.length?`<div class="dash-card"><div class="dash-card-label">Cuotas</div><div class="dash-card-value gold">${pagadas}/${cuotas.length}</div></div>`:''}
      ${proxima?`<div class="dash-card"><div class="dash-card-label">Próximo pago</div><div class="dash-card-value" style="font-size:12px;padding-top:4px;">${proxima.fecha||'—'}</div></div>`:''}
      ${mora.length?`<div class="dash-card"><div class="dash-card-label">En mora</div><div class="dash-card-value red">${mora.length}</div></div>`:''}
    </div>` : ''}

    ${c?.product && c.estado!=='solicitud' ? `
    ${pagadoTotal ? `
    <div class="historial-card">
      <div class="historial-badge">🎉 Pagado en su totalidad</div>
      <div style="font-size:16px;font-weight:800;margin-bottom:6px;">${c.product}</div>
      <div style="font-size:12px;color:rgba(255,255,255,0.5);">Total pagado: <strong style="color:var(--white);">${formatPrice(c.total)}</strong> · ${cuotas.length} cuotas</div>
    </div>` : `
    <div class="dash-product">
      <div class="dash-product-label">📦 Tu producto</div>
      <div class="dash-product-name">${c.product}</div>
      <div class="dash-product-meta">
        <span>💰 Total: <strong>${formatPrice(c.total||0)}</strong></span>
        <span>📥 Abono: <strong>${formatPrice(c.abono||0)}</strong></span>
        <span>📆 Cuota: <strong>${formatPrice(c.cuota||0)}</strong></span>
      </div>
    </div>`}` : ''}

    ${cuotasHtml&&c?.estado!=='solicitud' ? `<div class="dash-section-title">Plan de pagos</div>${cuotasHtml}` : ''}

    <div class="dash-help">
      <div class="dash-help-text">
        <div class="dash-help-title">¿Tienes alguna pregunta?</div>
        <div class="dash-help-sub">Escríbenos por WhatsApp</div>
      </div>
      <a href="https://wa.me/573233039179?text=Hola%20Zona%20iPhone!%20Soy%20${encodeURIComponent(user.displayName||user.email)}%20y%20tengo%20una%20consulta." target="_blank" class="btn-wa">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp
      </a>
    </div>
    <div style="height:40px;"></div>
  `;
}
</script>
</body>
</html>
